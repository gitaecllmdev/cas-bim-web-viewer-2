    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Shop Generator · CAS BIM</title>
    <!-- Standalone tool: no model, no viewer. Panels typed in or drawn, framed and drawn like the model's panel shops
         (demos/06-shop-drawings: generator.mjs, sheet.mjs). Everything stays in this browser (and the JSON file). -->
    <link rel="stylesheet" href="panel.css?v=bd61b63ef7">
    <link rel="stylesheet" href="shop-generator.css?v=83a565c6f5">
</head>
<body>
    <header class="bar gen-bar"><a class="brand" href="home.html">CAS BIM</a><b class="gen-title">Panel Shop Generator</b>
        <span class="gen-tag">Draw or type a panel: its framing shop drawing follows. No model needed · kept in this browser.</span>
        <span class="spacer"></span>
        <button class="bar-btn" data-act="new">+ New panel</button><button class="bar-btn ghost" data-act="copy">Duplicate</button></header>
    <main id="gen">
        <section class="card" id="elev-card">
            <div class="panel-row"><div id="panel-fields" class="panel-fields"></div><div id="elev-head" class="elev-head"></div></div>
            <div id="core-strip" class="core-strip"></div>
            <div class="elev-grid">
                <div class="elev-main">
                    <div class="tools" id="tools"></div>
                    <div class="flip-bar" id="flip-bar" role="group" aria-label="Flip and mirror">
                        <label class="pill" title="Flip panel: the stud layout, and its offsets on the sheet, start from the right end instead of the left"><input type="checkbox" data-f="layoutFromRight"><span>⇆ Flip panel</span><small>layout from the right end</small></label>
                        <label class="pill" title="Flip studs: the studs on center face the other way where they are (end studs and jambs still close their side)"><input type="checkbox" data-f="flipStuds"><span>⟲ Flip studs</span><small>webs the other way</small></label>
                        <label class="pill" title="Side B: the sheet draws the panel as seen from its other face (mirrored)"><input type="checkbox" data-f="sideB"><span>◧ Side B</span><small>mirror the sheet</small></label>
                        <span class="muted small flip-note">Right-click a stud or an opening to flip or mirror just that one.</span>
                    </div>
                    <div class="sketch-wrap">
                        <div class="sketch-corner">
                            <label class="opt-toggle" title="The opening optimizer: start the studs on center where the openings take the fewest stud pieces (every bay within the spacing). Off: on center from the left end.">
                                <input type="checkbox" data-f="optimizeOpenings"><span>Opening optimizer</span><small id="opt-info"></small></label>
                            <button class="corner-btn" id="preview-btn" data-act="preview" title="Flip to the framing elevation with its tags and dimensions for 5 seconds">⟲ Preview 5 s</button>
                        </div>
                        <div class="sketch-flip" id="sketch-flip">
                            <div class="sketch face front" id="sketch"></div>
                            <div class="face back" id="sketch-back" title="Click to go back to the sketch"></div>
                        </div>
                    </div>
                    <p id="tool-hint" class="muted small tool-hint"></p>
                    <div id="op-chips" class="op-chips"></div>
                    <div id="shape-points"></div>
                </div>
                <aside class="catalogue" id="catalogue" aria-label="Opening members"></aside>
            </div>
        </section>
        <section class="card" id="sheet-card" aria-label="Shop drawing">
            <div class="row pv-head"><h2 id="pv-title">Shop drawing</h2><span id="pv-check"></span><span class="spacer"></span>
                <button data-act="pdf">Download PDF</button><button class="secondary" data-act="link" title="A link that opens this panel in the generator">Copy link</button></div>
            <div id="pv-errors"></div>
            <div class="sheet" id="pv-sheet"></div>
        </section>
        <section class="card" id="set-card"></section>
        <div id="datalists" hidden></div>
        <div id="sk-menu" class="sk-menu" role="menu" aria-label="Options for what is under the pointer" hidden></div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
    </main>
    <p id="notice" class="toast" role="status" aria-live="polite" hidden></p>
    <dialog id="fr-dialog" class="fr-dialog" aria-label="An opening's framing"></dialog>
    <script type="module" src="shop-generator.js?v=ca18d254b9"></script>
</body>
</html>
