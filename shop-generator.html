    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Shop Generator · CAS BIM</title>
    <!-- Standalone tool: no model, no viewer. Panels typed in or drawn, framed and drawn like the model's panel shops
         (demos/06-shop-drawings: generator.mjs, framing-plan.mjs, sheet.mjs). A workspace: the panels on the left, the
         views of the selected panel in the middle (sketch, elevation, plan, 3D, drawing; the cut list and issues under
         them), its properties on the right (workspace.mjs: the selection and commands). Kept in this browser and the
         JSON file. -->
    <link rel="stylesheet" href="panel.css?v=a3793797eb">
    <link rel="stylesheet" href="shop-generator.css?v=514e10a39d">
    <link rel="stylesheet" href="shop-workspace.css?v=5ee293c7ac">
</head>
<body class="ws-body">
    <header class="bar gen-bar ws-bar">
        <a class="brand" href="home.html">CAS BIM</a><b class="gen-title">Panel Shop Generator</b>
        <span class="ws-history" role="group" aria-label="History">
            <span class="new-split hist-split"><button class="bar-btn ghost" data-act="undo" id="undo-btn" title="Undo (Ctrl+Z)" disabled>↶ Undo</button><button class="bar-btn ghost new-more" data-act="hist-menu" id="hist-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="hist-menu" title="The changes so far: undo back to any of them" disabled>▾</button>
                <div id="hist-menu" class="new-menu hist-menu" role="menu" aria-label="Undo back to" hidden></div></span>
            <button class="bar-btn ghost" data-act="redo" id="redo-btn" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
            <span id="dirty" class="dirty" role="status" aria-live="polite"></span>
        </span>
        <span class="spacer"></span>
        <span class="ws-hits" id="site-hits" hidden></span>
        <span class="ws-file" role="group" aria-label="Panels and files">
            <span class="new-split"><button class="bar-btn" data-act="new" title="A new panel like the open one: its shape and members (Ctrl+Alt+N)">+ New panel</button><button class="bar-btn new-more" data-act="new-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="new-menu" title="A blank panel, or one from a template">▾</button>
                <div id="new-menu" class="new-menu" role="menu" aria-label="New panel" hidden></div></span>
            <button class="bar-btn ghost" data-act="copy" id="dup-btn">Duplicate</button>
            <button class="bar-btn ghost" data-act="set-open" data-v="framing" title="Stud cutback, top gap, header/sill overlap and seating">Framing settings</button>
            <button class="bar-btn ghost" data-act="set-export" title="Download all panels and settings as an editable project JSON file">Save project</button>
            <details class="header-more"><summary>More ▾</summary><div class="header-menu">
                <button data-act="set-open">Set overview, stock &amp; labels</button>
                <button data-act="set-import">Import project</button>
                <button data-act="eng-open">Engineering</button>
                <button data-act="help">Keyboard shortcuts &amp; tips</button>
            </div></details>
        </span>
    </header>
    <main id="gen" class="ws">
        <aside id="nav" class="ws-nav" aria-label="Panels">
            <div class="nav-head"><button class="nav-toggle" data-act="nav-toggle" aria-expanded="true" aria-controls="set-card" title="Show or hide the panel list">◧ Panels</button></div>
            <section id="set-card" class="nav-body"></section>
        </aside>
        <section id="center" class="ws-center" aria-label="Views">
            <div class="view-bar">
                <div class="view-primary"><div class="view-tabs" role="tablist" aria-label="Views" id="view-tabs"></div>
                    <div class="side-pick" role="radiogroup" aria-label="Viewing side (the drawing only: members never change)" id="side-pick"></div>
                    <div class="workspace-actions" role="group" aria-label="Workspace layout">
                        <button class="secondary" data-act="layout-nav" aria-expanded="true" aria-controls="set-card">Panels</button>
                        <button class="secondary" data-act="inspector-toggle" aria-expanded="true" aria-controls="inspector">Properties</button>
                        <button class="secondary" data-act="focus-view" aria-pressed="false" title="Give the view the full workspace; click again to restore your panels">⛶ Focus view</button>
                    </div>
                </div>
            </div>
            <div class="view-status" id="pv-check" role="status" aria-live="polite"></div>
            <div class="views">
                <div class="view" id="view-sketch" data-view="sketch" role="tabpanel" aria-labelledby="tab-sketch">
                    <div class="tools" id="tools"></div>
                    <div id="wall-sketch-constraints"></div>
                    <div id="sketch-member-tools" class="sketch-member-bar" role="group" aria-label="Selected sketch member" hidden></div>
                    <div class="sketch-wrap">
                        <div class="sketch-zoom" role="group" aria-label="Sketch navigation"><button type="button" data-sketch-pan aria-pressed="false" title="Drag the view; press Escape to return to editing">Pan</button><button type="button" data-sketch-zoom="out" aria-label="Zoom out" title="Zoom out">−</button><output id="sketch-zoom-percent" aria-label="Zoom percentage" aria-live="polite">100%</output><button type="button" data-sketch-zoom="in" aria-label="Zoom in" title="Zoom in">+</button><button type="button" data-sketch-zoom="fit" title="Fit the whole wall">Show all</button></div>
                        <div class="sketch-flip" id="sketch-flip"><div class="sketch face front" id="sketch"></div></div>
                        <div id="sketch-help" class="sketch-help" role="note" aria-label="Sketch gesture hints"></div>
                    </div>
                    <p id="tool-hint" class="muted small tool-hint"></p>
                    <div id="op-chips" class="op-chips"></div>
                    <div id="shape-points"></div>
                </div>
                <div class="view" id="view-elevation" data-view="elevation" role="tabpanel" aria-labelledby="tab-elevation" hidden></div>
                <div class="view" id="view-plan" data-view="plan" role="tabpanel" aria-labelledby="tab-plan" hidden></div>
                <div class="view" id="view-3d" data-view="3d" role="tabpanel" aria-labelledby="tab-3d" hidden></div>
                <div class="view" id="view-compare" data-view="compare" role="tabpanel" aria-labelledby="tab-compare" hidden></div>
                <div class="view" id="view-drawing" data-view="drawing" role="tabpanel" aria-labelledby="tab-drawing" hidden>
                    <div class="row pv-head"><h2 id="pv-title">Shop drawing</h2><span class="spacer"></span>
                        <button data-act="pdf" id="pdf-btn">Current panel PDF</button><button class="secondary" data-act="link" title="A link that opens this panel in the generator">Copy link</button></div>
                    <div id="pv-errors"></div>
                    <div class="sheet" id="pv-sheet"></div>
                </div>
            </div>
            <div class="ws-bottom" id="bottom">
                <div class="bottom-tabs" role="tablist" aria-label="Cut list and issues" id="bottom-tabs"></div>
                <div class="bottom-body" id="bottom-body"></div>
            </div>
        </section>
        <aside id="inspector" class="ws-insp" aria-label="Properties">
            <div class="inspector-head"><b>Properties</b><button class="link" data-act="inspector-toggle" title="Hide properties to widen the view" aria-label="Hide properties">›</button></div>
            <div id="insp-context" class="insp-context"></div>
            <details class="insp-sec" data-sec="panel" open><summary>Panel</summary>
                <div class="panel-units"><label class="dimension-format" title="Format for sketch dimensions, editing fields and the on-screen cut list">Dimensions <select id="wall-dimension-format" data-dimension-format aria-label="Dimension format"><option value="feet-inches">Feet + inches</option><option value="decimal-feet">Feet (decimal)</option><option value="decimal-inches">Inches (decimal)</option><option value="fractional-inches">Inches (fraction)</option></select></label><p class="units-note muted small"></p></div>
                <div class="panel-row"><div id="panel-fields" class="panel-fields"></div><div id="elev-head" class="elev-head"></div></div></details>
            <details class="insp-sec" data-sec="members" open><summary>Members</summary><div id="core-strip" class="core-strip"></div></details>
            <details class="insp-sec" data-sec="opening"><summary id="opening-sum">Openings</summary><aside class="catalogue" id="catalogue" aria-label="Opening members"></aside></details>
            <details class="insp-sec" data-sec="layout"><summary>Stud layout and facing</summary><div id="layout-sec"></div></details>
            <details class="insp-sec" data-sec="context"><summary>Levels and grids</summary><div id="context-sec"></div></details>
        </aside>
        <div id="datalists" hidden></div>
        <div id="sk-menu" class="sk-menu" role="menu" aria-label="Options for what is under the pointer" hidden></div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
    </main>
    <p id="notice" class="toast" role="status" aria-live="polite" hidden></p>
    <dialog id="fr-dialog" class="fr-dialog" aria-label="An opening's framing"></dialog>
    <dialog id="set-dialog" class="fr-dialog set-dialog" aria-labelledby="sd-title"></dialog>
    <dialog id="help-dialog" class="fr-dialog help-dialog" aria-labelledby="help-title"></dialog>
    <script type="module" src="shop-generator.js?v=0a191788ec"></script>
