<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CAS Framing · Project board</title><link rel="stylesheet" href="framing-board.css?v=45-day-plan"></head>
<body><header class="app-bar"><a href="shop-generator.html">CAS BIM</a><b>Framing project board</b><span id="save-status" role="status" aria-live="polite">Loading…</span><button id="reload">Reload plan</button><button id="download">Download board</button></header>
<main><section class="overview"><div><span id="plan-range" class="eyebrow">WEB → REVIT</span><h1 id="project-title">Framing development</h1><p id="plan-summary">Loading the development plan…</p></div><div id="progress" class="progress"></div></section>
<div id="milestones" class="milestones" aria-label="Plan milestones"></div>
<div class="tools"><input id="search" type="search" aria-label="Search cards" placeholder="Search by # or text…"><select id="owner" aria-label="Filter by owner"><option value="">Everyone</option><option>You</option><option>Codex</option></select><select id="kind" aria-label="Filter by type"><option value="">All types</option><option value="test">Tests for you</option><option value="proposal">Proposals</option><option value="task">Development</option><option value="rule">Agreed rules</option></select><select id="timing" aria-label="Filter by day"><option value="">All days</option><option value="weekend">Weekend checkpoints</option></select><button id="add" class="primary">+ Card</button><label class="load">Load board<input type="file" id="import" accept="application/json,.json"></label><button id="attach">Attach panel context</button></div>
<nav id="lane-tabs" aria-label="Board columns"></nav><div id="board" class="board" aria-label="Framing planning board"></div><p id="storage-note" class="hint"></p></main>
<dialog id="editor"><form method="dialog"><header><div><span class="eyebrow">FRAMING BOARD</span><b id="card-reference">Card details</b></div><button value="cancel" aria-label="Close">×</button></header><div class="editor-body"><div id="card-dependencies" aria-label="Prerequisites"></div><label>Title<input id="card-title" maxlength="300" required></label><div class="fields"><label>Status<select id="card-lane"><option value="backlog">Planned</option><option value="active">In progress</option><option value="review">Your review</option><option value="done">Done</option></select></label><label>Owner<select id="card-owner"><option>You</option><option>Codex</option></select></label><label>Due date<input id="card-due" type="date"></label><label>Type<select id="card-kind"><option value="task">Development</option><option value="test">Manual test</option><option value="proposal">Proposal</option><option value="rule">Agreed rule</option></select></label><label>Priority<select id="card-priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label><label>Panel / scope<input id="card-panel" maxlength="300"></label></div><label>Context / proposed work<textarea id="card-notes" rows="3" maxlength="8000"></textarea></label><label>What to check / completion criteria<textarea id="card-acceptance" rows="3" maxlength="8000"></textarea></label><label>Your results / decision<textarea id="card-results" rows="3" maxlength="8000" placeholder="Record what passed, what looks wrong and which panel or member…"></textarea></label><label>Evidence / reference<textarea id="card-evidence" rows="2" maxlength="8000"></textarea></label></div><footer><button type="button" id="delete">Delete card</button><span></span><button value="cancel">Cancel</button><button class="primary" id="save-card" value="save">Save card</button></footer></form></dialog>
<script type="module" src="framing-board.js?v=45-day-plan"></script></body></html>
